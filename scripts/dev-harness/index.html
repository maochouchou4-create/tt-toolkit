<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tt-toolkit dev-harness（宿主 stub 调试台）</title>
    <!-- 顺序：先宿主 stub（stubs.js 经典脚本），再产物模块（dist-harness/，
         由 build.mjs 生成；type=module 延迟执行——经典脚本先装配完，装配序
         不变）；样式＝宿主危险规则模拟（host-sim.css，先于产物＝复刻真实宿主
         加载序）+ tt-toolkit 产物样式 + 宿主骨架模拟样式 -->
    <link rel="stylesheet" href="host-sim.css">
    <link rel="stylesheet" href="../../dist/index.css">
    <link rel="stylesheet" href="harness.css">
</head>
<body>
    <!-- 仿宿主顶栏（占 --topBarBlockSize 高度；壳 top 锚点引用该变量） -->
    <header id="topBar">
        <span class="harness-title">tt-toolkit dev-harness</span>
        <span class="harness-note">宿主 stub 调试台——全部内存态，刷新即重置</span>
        <div class="harness-actions">
            <button type="button" class="harness-btn" onclick="__TT_HARNESS_UI__.toggleChoiceGenerate()">生成/取消</button>
            <button type="button" class="harness-btn" onclick="__TT_HARNESS_UI__.toggleTheme()">切换主题</button>
            <button type="button" class="harness-btn" onclick="__TT_HARNESS_UI__.resetData()">重置数据</button>
        </div>
    </header>

    <main id="sheld">
        <!-- 聊天区（nav 模块 DOM 契约：SCROLL_ROOT=#chat，楼层=.mes[mesid]） -->
        <div id="chat"></div>
        <div id="form_sheld">
            <!-- 仿宿主魔棒菜单（appendWandMenuEntry 注入目标；宿主内默认收起，
                 harness 常开便于点开壳） -->
            <div id="extensionsMenu"></div>
            <form id="send_form">
                <!-- 镜像宿主输入区骨架（TauriTavern/src/index.html:8389-8425）：
                     本扩展已不在输入区挂任何常驻件，骨架保留只为验证「无本扩展
                     节点混入宿主图标槽」这条外观红线 -->
                <div id="nonQRFormItems">
                    <div id="leftSendForm"></div>
                    <textarea id="send_textarea" placeholder="假装这里是宿主输入框"></textarea>
                    <div id="rightSendForm">
                        <div id="send_but" title="发送">➤</div>
                        <div id="mes_stop" title="暂停" class="mes_stop">■</div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- 宿主浮层挂载点（mountShell 在 #movingDivs 下建 #tt-shell-mount） -->
    <div id="movingDivs"></div>

    <script src="stubs.js"></script>
    <script type="module" src="dist-harness/index.js"></script>
    <script type="module">
        // 产物模块执行完（mountShell 已注册 APP_READY once）后放行就绪信号，
        // 魔棒条目挂载链路走完整等待的真实第二段。本段必须是模块脚本：模块
        // 按文档序延迟执行，晚于产物模块；改回经典内联脚本会抢在延迟的产物
        // 模块之前跑，就绪信号早于监听注册＝事件丢失
        __TT_HARNESS_UI__.emitAppReady();
    </script>
</body>
</html>
